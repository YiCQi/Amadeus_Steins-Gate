# Amadeus configuration. Copy to config.toml (start.bat does this for you).
# LLM settings below are only defaults — the in-app settings panel overrides them.

[server]
host = "127.0.0.1"   # "0.0.0.0" to open it from your phone on the same Wi-Fi
port = 8710

[llm]
# "openai"    = any OpenAI-compatible API (OpenAI, DeepSeek, OpenRouter, Groq, Ollama, LM Studio...)
# "anthropic" = Anthropic Messages API
provider = "openai"
base_url = "https://api.openai.com/v1"
api_key = ""
model = ""
temperature = 0.8
reasoning_effort = "" # for "thinking" models: "low" answers far sooner. Leave "" for normal models.
max_history = 30      # conversation turns sent to the model

[user]
name = ""
language = "en"       # subtitle / conversation language: "en" or "zh" (voice is always Japanese)

[news]
# When a conversation goes quiet she sometimes speaks up on her own, and may bring up something
# she read today: a few headlines from these RSS / Atom feeds, fetched at most once an hour.
# enabled = false: no news (she still speaks up; turn that off in the app's settings).
enabled = true
feeds = [
  "https://www.sciencedaily.com/rss/mind_brain.xml",   # neuroscience, her field
  "https://www3.nhk.or.jp/rss/news/cat0.xml",          # NHK headlines
]

[stt]
mode = "local"        # "local" = faster-whisper on your GPU, "browser" = Chrome/Edge Web Speech API
model = "small"       # tiny / base / small / medium / large-v3
device = "cuda"       # falls back to CPU automatically

[tts]
enabled = true
# "auto"       = your own GPT-SoVITS clone when a reference clip is set up, else the Amadeus voice
#                (mio/amadeus) when tools\voice\install_amadeus_vits.bat has installed it, else
#                a free Microsoft neural Japanese voice (edge-tts, needs internet)
# "gpt-sovits" / "vits" / "edge" = that voice only
engine = "auto"
vits_speed = 1.0      # Amadeus voice: > 1 speaks slower (emotions adjust it a little)
vits_port = 9881      # its local service; the app starts and stops it
edge_voice = "ja-JP-NanamiNeural"
edge_rate = 3         # percent faster
edge_pitch = -6       # Hz; Nanami is ~239 Hz by default, -6 gives Kurisu's calmer ~228 Hz
url = "http://127.0.0.1:9880"     # GPT-SoVITS api_v2.py
# Fine-tuned Kurisu weights (optional — leave empty to use whatever api_v2 has loaded / zero-shot)
gpt_weights = ""      # e.g. "D:/GPT-SoVITS/GPT_weights_v2Pro/kurisu-e15.ckpt"
sovits_weights = ""   # e.g. "D:/GPT-SoVITS/SoVITS_weights_v2Pro/kurisu_e8_s400.pth"
speed = 1.0
top_k = 15
top_p = 1.0
temperature = 1.0
default_ref = "neutral"

# Reference clips: 3–10 s of clean Kurisu speech + its exact Japanese transcript.
# The reply's emotion picks the matching clip, so tone follows the mood.
# Any emotion without a clip uses default_ref.
# Emotions: neutral, happy, annoyed, embarrassed, sad, surprised, thinking, smug

[tts.refs.neutral]
audio = "voice/refs/neutral.wav"
text = ""

